name: Build and Measure

on:
  push:
    branches: [ experiment-with-tsup ]
  pull_request:
    branches: [ experiment-with-tsup ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Run build and measure script
        run: ./measure.sh

